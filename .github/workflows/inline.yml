# 不推代码：脚本正文通过 workflow_dispatch 输入传入，运行时落盘执行。
# 结果发布到 GitHub Release（不是 artifact）：永久链接、公开可下、无需认证。
name: inline

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Python 脚本全文'
        required: true
      script_name:
        description: '落盘文件名'
        required: false
        default: 'job.py'
      requirements:
        description: '额外依赖，空格分隔（如 "numpy==2.5.4 scipy"）'
        required: false
        default: ''
      timeout_min:
        description: '超时分钟（上限 360）'
        required: false
        default: '30'

permissions:
  contents: write      # 发布 Release 需要

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout_min) }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 用 env 传，避免 ${{ }} 直接插进 shell 造成注入
      - name: 写入脚本
        env:
          SCRIPT_BODY: ${{ inputs.script }}
          SCRIPT_NAME: ${{ inputs.script_name }}
        run: |
          python - <<'PY'
          import os, pathlib
          pathlib.Path(os.environ["SCRIPT_NAME"]).write_text(
              os.environ["SCRIPT_BODY"], encoding="utf-8")
          print("wrote", os.environ["SCRIPT_NAME"],
                len(os.environ["SCRIPT_BODY"]), "chars")
          PY

      - name: 安装依赖
        if: inputs.requirements != ''
        env:
          REQS: ${{ inputs.requirements }}
        run: python -m pip install --no-input $REQS

      - name: 执行
        env:
          SCRIPT_NAME: ${{ inputs.script_name }}
        run: python "$SCRIPT_NAME"

      - name: 发布到 Release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          SCRIPT_NAME: ${{ inputs.script_name }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          mkdir -p _publish
          [ -f "$SCRIPT_NAME" ] && cp "$SCRIPT_NAME" _publish/
          if [ -d outputs ] && [ -n "$(ls -A outputs)" ]; then
            cp -r outputs/. _publish/
          fi
          echo "--- 待发布 ---"; ls -la _publish
          TAG="run-$RUN_ID"
          # 没有 checkout，gh 无法从 .git 推断仓库，必须显式 --repo
          gh release create "$TAG" _publish/* \
            --repo "$REPO" \
            --title "run $RUN_ID" \
            --notes "inline 工作流产物。原始脚本随附为资产，可直接复跑。" \
            || gh release upload "$TAG" _publish/* --repo "$REPO" --clobber
          echo "RELEASE_URL=https://github.com/$REPO/releases/tag/$TAG"
