# 不推代码：脚本正文通过 workflow_dispatch 输入传入。
# 环境来自仓库里的 toolenv/（工具库投影），研究员不需要自己装依赖。
# 结果发布到 GitHub Release：永久链接、公开可下、无需认证。
name: inline

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Python 脚本全文'
        required: true
      script_name:
        description: '落盘文件名（同时作为资产名）'
        required: false
        default: 'job.py'
      requirements:
        description: '额外依赖，空格分隔；工具库已含 numpy/scipy/matplotlib'
        required: false
        default: ''
      timeout_min:
        description: '超时分钟，必须是整数字符串（默认 30，上限 360）'
        required: false
        default: '30'
      project:
        description: '项目 slug（ASCII，如 aero），用于区分 Release。不填则记 default'
        required: false
        default: 'default'
      label:
        description: '给这次运行起个名字，便于在列表里认领'
        required: false
        default: ''
      assets:
        description: '资源清单 JSON：[{"url":...,"sha256":...,"name":...}]。URL 每次触发现给，不进仓库'
        required: false
        default: '[]'
      wolfram:
        description: "true = 装 Wolfram Engine 15 并用 WOLFRAM_MATHPASS 配置许可"
        required: false
        default: 'false'

run-name: "${{ inputs.project }} · ${{ inputs.script_name }} · ${{ inputs.label || github.actor }} · run ${{ github.run_id }}"

permissions:
  contents: write      # 发布 Release 需要

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout_min) }}
    steps:
      - name: 取工具库环境
        uses: actions/checkout@v4
        with:
          sparse-checkout: toolenv
          sparse-checkout-cone-mode: false

      # Python 版本也由工具库定义，和包一起钉死在 toolenv/ 里。
      # 不写 '3.14'——那会跟着 runner 的补丁版本漂移（实测一天内从 .9 跳到 .10）。
      # 输入校验放在最前面：宁可 5 秒失败，也不要跑完 30 分钟才发现 project 不合法
      - name: 校验输入
        id: validate
        env:
          PROJECT_RAW: ${{ inputs.project }}
          TIMEOUT_MIN: ${{ inputs.timeout_min }}
        run: |
          set -eu
          RAW="${PROJECT_RAW:-default}"
          case "$RAW" in
            *[!A-Za-z0-9._-]*)
              echo "::error::project 只能包含 [A-Za-z0-9._-]，收到 '$RAW'。"
              echo "::error::中文请换成 ASCII slug，例如 aero。否则 tag 会退化成 ---- 且无法区分。"
              exit 1 ;;
          esac
          case "${TIMEOUT_MIN:-30}" in
            *[!0-9]*|'')
              echo "::error::timeout_min 必须是整数字符串，收到 '${TIMEOUT_MIN}'。"
              exit 1 ;;
          esac
          echo "project=$RAW  timeout_min=${TIMEOUT_MIN:-30}"

      - uses: actions/setup-python@v5
        with:
          python-version-file: toolenv/python-version.txt

      - name: 安装工具库环境
        id: install
        run: |
          if [ -f toolenv/requirements.txt ]; then
            python -m pip install --no-input --quiet -r toolenv/requirements.txt
            echo "工具库环境已装：" && python -m pip list --format=freeze | wc -l
          else
            echo "::warning::toolenv/requirements.txt 缺失，远程环境为空"
          fi

      # 环境装完立刻验一次：坏环境在这里就中止，不要等脚本跑完才发现
      - name: 环境自检
        run: python toolenv/selfcheck.py

      # ── 大资源：安装包、数据集、私有二进制 ──────────────────────────
      # URL 走 dispatch 输入，不在仓库里留任何链接——所以签名过期与否无关。
      # 按 sha256 缓存：内容没变就跳过下载，改了才重拉。
      - name: 解析资源清单
        id: assets
        env:
          ASSETS: ${{ inputs.assets }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, sys
          raw = (os.environ.get("ASSETS") or "").strip() or "[]"
          try:
              items = json.loads(raw)
          except Exception as e:
              sys.exit(f"assets 不是合法 JSON：{e}")
          if not isinstance(items, list):
              sys.exit("assets 必须是数组")
          for a in items:
              if not isinstance(a, dict) or not a.get("url"):
                  sys.exit(f"每条资源必须有 url：{a}")
              a.setdefault("name", os.path.basename(a["url"].split("?")[0]) or "asset")
          pathlib.Path("_assets").mkdir(exist_ok=True)
          pathlib.Path("_assets/manifest.json").write_text(
              json.dumps(items, ensure_ascii=False, indent=1), encoding="utf-8")
          key = hashlib.sha256("|".join(sorted(
              a.get("sha256") or a["url"] for a in items)).encode()).hexdigest()[:16]
          print(f"{len(items)} 个资源，缓存键 {key}")
          for a in items:
              print(f"  {a['name']:<32} {(a.get('sha256') or '(无校验)')[:20]}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"count={len(items)}\nkey={key}\n")
          PY

      - name: 缓存资源
        if: steps.assets.outputs.count != '0'
        uses: actions/cache@v4
        with:
          path: _assets
          key: assets-${{ steps.assets.outputs.key }}

      - name: 拉取资源
        if: steps.assets.outputs.count != '0'
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, shutil, subprocess, sys

          def sha256_of(path, chunk=8 << 20):
              h = hashlib.sha256()
              with open(path, "rb") as fh:
                  while True:
                      b = fh.read(chunk)
                      if not b:
                          break
                      h.update(b)
              return h.hexdigest()

          items = json.loads(pathlib.Path("_assets/manifest.json").read_text(encoding="utf-8"))
          for a in items:
              dest = pathlib.Path("_assets") / a["name"]
              want = (a.get("sha256") or "").lower()
              if dest.exists():
                  if want and sha256_of(dest) == want:
                      print(f"  缓存命中  {a['name']}  ({dest.stat().st_size/1e6:.0f} MB)")
                      continue
                  if not want:
                      print(f"  ::warning::无 sha256，跳过校验并重下 {a['name']}")
              tmp = dest.with_suffix(dest.suffix + ".part")
              print(f"  下载      {a['name']}")
              r = subprocess.run(["curl", "-fL", "--retry", "5", "--retry-delay", "5",
                                  "--retry-all-errors", "-C", "-", "-o", str(tmp), a["url"]])
              if r.returncode != 0:
                  sys.exit(f"下载失败：{a['name']}")
              if want:
                  got = sha256_of(tmp)
                  if got != want:
                      sys.exit(f"sha256 不符 {a['name']}\n  期望 {want}\n  实际 {got}")
              tmp.replace(dest)
              print(f"            {dest.stat().st_size/1e6:.0f} MB  校验通过")
          PY
          echo "ASSETS_DIR=$PWD/_assets" >> "$GITHUB_ENV"
          ls -lh _assets | sed 's/^/  /'

      # ── 大型软件：Wolfram Engine ────────────────────────────────
      # 安装器是交互式的，但 MathInstaller 自带 -auto，实测免交互、63 秒、rc=0。
      # 安装包由 assets 提供（URL 每次触发现给），sha256 钉死后可命中缓存。
      - name: 安装 Wolfram Engine
        if: inputs.wolfram == 'true'
        run: |
          set -eu
          sh=$(ls "${ASSETS_DIR:-_assets}"/Wolfram*.sh 2>/dev/null | head -1)
          [ -n "$sh" ] || { echo "::error::assets 里没有 Wolfram 安装包"; exit 1; }
          echo "安装包 $sh"
          sudo bash "$sh" -- -auto -targetdir=/opt/WolframEngine -execdir=/usr/local/bin
          # -execdir 只链了 WolframKernel；wolframscript 装在另一个前缀下，手动补
          sudo ln -sf /opt/Wolfram/WolframScript/bin/wolframscript /usr/local/bin/wolframscript
          sudo ln -sf /opt/WolframEngine/Executables/wolfram /usr/local/bin/wolfram
          wolframscript -version
          wolfram -version

      # 许可：secret 只在这一步出现，写进文件后立即消失。
      # 绝不 echo 它的内容——仓库是 public，日志对外可见。
      - name: 配置 Wolfram 许可
        if: inputs.wolfram == 'true'
        env:
          MATHPASS: ${{ secrets.WOLFRAM_MATHPASS }}
        run: |
          set -eu
          if [ -z "${MATHPASS:-}" ]; then
            echo "::error::WOLFRAM_MATHPASS 未配置"; exit 1
          fi
          mkdir -p "$HOME/.WolframEngine/Licensing"
          # 原文件以换行结尾；GitHub 存 secret 时会吃掉尾部换行，这里补回来
          printf '%s\n' "$MATHPASS" > "$HOME/.WolframEngine/Licensing/mathpass"
          chmod 600 "$HOME/.WolframEngine/Licensing/mathpass"
          f="$HOME/.WolframEngine/Licensing/mathpass"
          echo "字节: $(wc -c < "$f")  行数: $(wc -l < "$f")"
          echo "各行长度: $(awk '{printf "%d ", length($0)}' "$f")"
          echo "首字符: $(head -c 1 "$f")  含冒号行: $(grep -c ':' "$f" || true)"
          echo "--- 激活验证 ---"
          wolframscript -code '1+1'

      - name: 额外依赖
        if: inputs.requirements != ''
        env:
          REQS: ${{ inputs.requirements }}
        run: python -m pip install --no-input $REQS

      # 用 env 传，避免 ${{ }} 直接插进 shell 造成注入
      - name: 写入脚本
        env:
          SCRIPT_BODY: ${{ inputs.script }}
          SCRIPT_NAME: ${{ inputs.script_name }}
        run: |
          python - <<'PY'
          import os, pathlib
          pathlib.Path(os.environ["SCRIPT_NAME"]).write_text(
              os.environ["SCRIPT_BODY"], encoding="utf-8")
          print("wrote", os.environ["SCRIPT_NAME"],
                len(os.environ["SCRIPT_BODY"]), "chars")
          PY

      - name: 执行
        id: run_script
        env:
          SCRIPT_NAME: ${{ inputs.script_name }}
        run: python "$SCRIPT_NAME"

      # 只在环境真的装成功之后才发布。
      # 校验失败或安装失败时发布，会拿 runner 的系统 Python 生成一份假的环境快照
      # （python 3.12.3、toolenv_drift 全 null、frozen 是 84 行系统包），比不发还糟。
      - name: 发布到 Release
        if: always() && steps.validate.outcome == 'success' && steps.install.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          SCRIPT_NAME: ${{ inputs.script_name }}
          EXTRA_REQS: ${{ inputs.requirements }}
          TIMEOUT_MIN: ${{ inputs.timeout_min }}
          LABEL: ${{ inputs.label }}
          PROJECT_RAW: ${{ inputs.project }}
          SCRIPT_OUTCOME: ${{ steps.run_script.outcome }}
          REF: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -eu

          # 字符集已在「校验输入」步骤把关，这里只做小写归一。
          # 必须在写 run_meta 之前算好，否则 meta 里记不到。
          PROJ=$(printf '%s' "${PROJECT_RAW:-default}" | tr 'A-Z' 'a-z')
          [ -n "$PROJ" ] || PROJ=default
          export PROJ
          export PROJ_RAW="${PROJECT_RAW:-default}"
          echo "project=$PROJ" 

          mkdir -p _publish
          [ -f "$SCRIPT_NAME" ] && cp "$SCRIPT_NAME" _publish/

          # outputs/ 允许有子目录：拍平成一层的资产名，避免 gh 报 "is a directory" 而丢结果
          if [ -d outputs ]; then
            while IFS= read -r -d '' f; do
              rel="${f#outputs/}"
              cp "$f" "_publish/${rel//\//_}"
            done < <(find outputs -type f -print0)
          fi

          # 环境记录：让"可复跑"变成"可精确复现"。
          # 同时记录实际装了什么——extra requirements 可能覆盖 toolenv 的版本。
          python - <<'PY'
          import hashlib, json, os, pathlib, platform, subprocess, sys

          def parse_reqs(text):
              out = {}
              for line in text.splitlines():
                  line = line.strip()
                  if not line or line.startswith("#") or "==" not in line:
                      continue
                  k, v = line.split("==", 1)
                  out[k.strip().lower()] = v.strip()
              return out

          freeze = subprocess.run([sys.executable, "-m", "pip", "freeze"],
                                  capture_output=True, text=True).stdout
          pathlib.Path("_publish/requirements.frozen.txt").write_text(
              freeze, encoding="utf-8")

          env_file = pathlib.Path("toolenv/requirements.txt")
          base = parse_reqs(env_file.read_text()) if env_file.exists() else {}
          actual = parse_reqs(freeze)
          drift = {k: {"expected": v, "actual": actual.get(k)}
                   for k, v in base.items() if actual.get(k) != v}

          meta = {
              "run_id": os.environ["RUN_ID"],
              "project": os.environ.get("PROJ", ""),
              "project_raw": os.environ.get("PROJ_RAW", ""),
              "label": os.environ.get("LABEL", ""),
              "script_name": os.environ["SCRIPT_NAME"],
              "script_outcome": os.environ.get("SCRIPT_OUTCOME", ""),
              "extra_requirements": os.environ.get("EXTRA_REQS", ""),
              "timeout_min": os.environ.get("TIMEOUT_MIN", ""),
              "ref": os.environ.get("REF", ""),
              "python": platform.python_version(),
              "runner_os": os.environ.get("RUNNER_OS", ""),
              "runner_image": os.environ.get("ImageOS", ""),
              "toolenv_requirements_sha256": (
                  hashlib.sha256(env_file.read_bytes()).hexdigest()
                  if env_file.exists() else None),
              "frozen_sha256": hashlib.sha256(freeze.encode()).hexdigest(),
              "toolenv_drift": drift,
          }
          pathlib.Path("_publish/run_meta.json").write_text(
              json.dumps(meta, ensure_ascii=False, indent=2), encoding="utf-8")
          if drift:
              print("::warning::extra requirements 覆盖了工具库版本:",
                    json.dumps(drift, ensure_ascii=False))
          else:
              print("环境与工具库一致")
          PY

          echo "--- 待发布 ---"; ls -la _publish
          TAG="run-$PROJ-$RUN_ID"
          mapfile -d '' FILES < <(find _publish -maxdepth 1 -type f -print0)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::没有可发布的文件"
            exit 1
          fi

          # 发布失败 = 结果全丢，所以这里必须重试。
          # 注意：--notes 里不要用反引号，bash 会当命令替换执行。
          NOTE="项目 $PROJ · 脚本 $SCRIPT_NAME；环境见 run_meta.json"
          published=0
          for i in 1 2 3 4 5; do
            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              gh release upload "$TAG" "${FILES[@]}" --repo "$REPO" --clobber && published=1 && break
            else
              gh release create "$TAG" "${FILES[@]}" \
                --repo "$REPO" --title "$PROJ · $SCRIPT_NAME · run $RUN_ID" --notes "$NOTE" \
                && published=1 && break
            fi
            echo "::warning::发布第 $i 次失败，10 秒后重试"
            sleep 10
          done
          if [ "$published" -ne 1 ]; then
            echo "::error::发布失败，结果未落地。请重新 dispatch（会得到新的 run_id）。"
            exit 1
          fi
          echo "RELEASE_URL=https://github.com/$REPO/releases/tag/$TAG"
